name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check src evals tests
      - run: uv run ruff format --check src evals tests
      - run: uv run mypy
      - run: uv run pytest --cov=denial_desk --cov-report=term-missing

  # The eval gate. See ADR-019: this is the job that makes the repo interesting.
  # It must fail the build when quality drops or cost rises, not just report numbers.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: denial
          POSTGRES_PASSWORD: denial
          POSTGRES_DB: denial_desk
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: postgresql+psycopg://denial:denial@localhost:5432/denial_desk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: Run eval suites and compare against the committed baseline
        run: uv run python -m evals.runner --suites accuracy robustness cost safety --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
