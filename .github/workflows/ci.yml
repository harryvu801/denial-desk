name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check src evals tests
      - run: uv run ruff format --check src evals tests
      - run: uv run mypy
      - run: uv run pytest --cov=denial_desk --cov-report=term-missing

  # The eval gate (ADR-019). The model lane is replayed from committed recordings, so this
  # job needs no API key, no database and spends nothing (ADR-030). It fails the build when
  # a gated metric in evals/baseline.json regresses beyond its tolerance; wrong actions and
  # missing recordings have zero tolerance. Baseline updates go in their own commit.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: Replay the model lane and gate against the committed baseline
        run: uv run python -m evals.runner --suites accuracy --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
