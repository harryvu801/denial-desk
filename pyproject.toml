[project]
name = "denial-desk"
version = "0.1.0"
description = "An evaluated AI system for triaging Medicaid claim denials and drafting appeals. Synthetic data only."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "rank-bm25>=0.2.2",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.15",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.119",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]
evals = [
    "scikit-learn>=1.5",     # cohen_kappa_score, F1, confusion matrix
    "numpy>=2.1",
    "pandas>=2.2",
    "tabulate>=0.9",
]

[project.scripts]
dd = "denial_desk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denial_desk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: requires Postgres and/or a live model API",
    "costly: makes real model calls — excluded from the default run",
]
addopts = "-m 'not costly'"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "evals"]
plugins = ["pydantic.mypy"]
