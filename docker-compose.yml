services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: denial
      POSTGRES_PASSWORD: denial
      POSTGRES_DB: denial_desk
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denial"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://denial:denial@db:5432/denial_desk
    env_file: [.env]
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: uvicorn denial_desk.api.main:create_app --factory --host 0.0.0.0 --port 8000 --reload

volumes:
  dbdata:
