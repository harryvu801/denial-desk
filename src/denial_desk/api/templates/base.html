<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Denial Desk{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2457c5; --det: #1f7a4d; --det-bg: #e3f3ea; --hum: #9a5b00; --hum-bg: #fbefd9;
    --mod: #6b3fb5; --mod-bg: #efe7fb;
    --bad: #b3261e; --bad-bg: #fbe4e2; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecece8; --muted: #a2a29b; --line: #34342f;
      --accent: #7aa2ff; --det: #6fd19f; --det-bg: #183527; --hum: #f0b45c; --hum-bg: #3a2a12;
      --mod: #c3a6ff; --mod-bg: #2c2140;
      --bad: #ff8a80; --bad-bg: #3d1a17; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; gap: 1.5rem; align-items: baseline; padding: .9rem 1.25rem;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header strong { font-size: 1.05rem; }
  header nav a { margin-right: 1rem; }
  .banner { font-size: .8rem; color: var(--muted); }
  main { padding: 1.25rem; max-width: 1200px; margin: 0 auto; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .75rem;
           margin-bottom: 1rem; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; }
  .stat .v { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: .8rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem;
           margin-bottom: 1rem; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td.num, th.num { text-align: right; }
  tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .badge { display: inline-block; padding: .05rem .45rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .deterministic { color: var(--det); background: var(--det-bg); }
  .human { color: var(--hum); background: var(--hum-bg); }
  .model { color: var(--mod); background: var(--mod-bg); }
  .untrusted { border-left: 3px solid var(--hum); padding: .4rem .75rem; background: var(--hum-bg); border-radius: 4px; }
  .cited { outline: 2px solid var(--mod); outline-offset: 1px; border-radius: 3px; }
  h3 { font-size: .85rem; margin: .9rem 0 .35rem; color: var(--muted); font-weight: 600; }
  .unverified { color: var(--bad); background: var(--bad-bg); }
  .muted { color: var(--muted); }
  form.filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .75rem; }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .5rem; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: .4rem .9rem; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; } h2 { font-size: 1rem; margin: 0 0 .6rem; }
  ul.cites { margin: .25rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .85rem; }
  .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .75rem; }
  .stat .sub { color: var(--muted); font-size: .72rem; margin-top: .15rem; }
  header nav a { color: var(--muted); padding-bottom: .2rem; }
  header nav a[aria-current="page"] { color: var(--ink); font-weight: 600;
    border-bottom: 2px solid var(--accent); text-decoration: none; }
  abbr[title] { text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; }
  th a.sort { color: inherit; display: inline-flex; gap: .25rem; align-items: center; }
  th a.sort:hover { color: var(--ink); text-decoration: none; }
  th a.sort.on { color: var(--ink); font-weight: 600; }
  th a.sort .arrow { font-size: .65rem; opacity: .45; }
  th a.sort.on .arrow { opacity: 1; }
  .search input { min-width: 21rem; }
  /* Code cells keep their tooltip but drop the underline: headers say what is hoverable. */
  td abbr[title] { text-decoration: none; }
  .clear { font-size: .85rem; }
  .status { font-weight: 500; }
  .status.approved { color: var(--det); } .status.rejected { color: var(--bad); }
  .status.overridden { color: var(--mod); }
  .pager { display: flex; gap: 1rem; align-items: center; justify-content: flex-end; margin: -.25rem 0 1rem; }
  .flash { background: var(--det-bg); color: var(--det); border-radius: 8px; padding: .6rem 1rem;
           margin-bottom: 1rem; font-weight: 500; }
  .back { display: inline-block; margin-bottom: .5rem; font-size: .85rem; }
  td.empty { padding: 1.5rem .6rem; white-space: normal; }
  code { font-size: .85em; }
  td code { color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
                     clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <strong><a href="/">Denial Desk</a></strong>
  <nav aria-label="Main">
    <a href="/" {% if active == "queue" %}aria-current="page"{% endif %}>Review queue</a>
    <a href="/audit" {% if active == "audit" %}aria-current="page"{% endif %}>Audit log</a>
  </nav>
  <span class="banner">Synthetic data only &middot; Nothing is ever submitted to a payer</span>
</header>
<main>
{% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
